<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" width="100%" height="100%" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050811" />
      <stop offset="50%" stop-color="#091024" />
      <stop offset="100%" stop-color="#060A17" />
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="cyan-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="50%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>

    <linearGradient id="title-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="40%" stop-color="#E2F1FF" />
      <stop offset="80%" stop-color="#00F0FF" />
    </linearGradient>

    <linearGradient id="terminal-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0B1326" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#070C18" stop-opacity="0.95" />
    </linearGradient>

    <linearGradient id="border-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#3B82F6" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0.6" />
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="drop-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#00F0FF" flood-opacity="0.15" />
    </filter>
  </defs>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&amp;family=Inter:wght@400;600;800;900&amp;display=swap');
    .title-text { font-family: 'Inter', system-ui, -apple-system, sans-serif; font-weight: 900; letter-spacing: -0.5px; }
    .subtitle-text { font-family: 'Fira Code', monospace; font-weight: 700; letter-spacing: 0.5px; }
    .body-text { font-family: 'Inter', system-ui, -apple-system, sans-serif; }
    .code-text { font-family: 'Fira Code', 'Courier New', monospace; font-size: 13px; line-height: 20px; }
    
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }
    .cursor { animation: blink 1s infinite; }
  </style>

  <!-- Canvas Background -->
  <rect width="1200" height="460" rx="16" fill="url(#bg)" stroke="url(#border-grad)" stroke-width="2" />

  <!-- Background Decorative Grid Lines -->
  <g opacity="0.08" stroke="#00F0FF" stroke-width="1">
    <line x1="0" y1="60" x2="1200" y2="60" />
    <line x1="0" y1="140" x2="1200" y2="140" />
    <line x1="0" y1="220" x2="1200" y2="220" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="0" y1="380" x2="1200" y2="380" />
    <line x1="120" y1="0" x2="120" y2="460" />
    <line x1="280" y1="0" x2="280" y2="460" />
    <line x1="440" y1="0" x2="440" y2="460" />
    <line x1="600" y1="0" x2="600" y2="460" />
    <line x1="760" y1="0" x2="760" y2="460" />
    <line x1="920" y1="0" x2="920" y2="460" />
    <line x1="1080" y1="0" x2="1080" y2="460" />
  </g>

  <!-- Ambient Glow Spheres -->
  <circle cx="150" cy="120" r="180" fill="#00F0FF" opacity="0.06" filter="url(#neon-glow)" />
  <circle cx="1050" cy="340" r="200" fill="#8B5CF6" opacity="0.07" filter="url(#neon-glow)" />

  <!-- ==================== LEFT COLUMN: BRANDING & ROLE ==================== -->

  <!-- Status Badge -->
  <g transform="translate(60, 50)">
    <rect width="320" height="30" rx="15" fill="#00F0FF" fill-opacity="0.1" stroke="#00F0FF" stroke-opacity="0.3" stroke-width="1" />
    <circle cx="18" cy="15" r="4.5" fill="#00F0FF" filter="url(#neon-glow)" />
    <text x="32" y="20" fill="#00F0FF" font-family="'Fira Code', monospace" font-size="11" font-weight="600" letter-spacing="1">● PLATFORM STATUS: MISSION CRITICAL</text>
  </g>

  <!-- MAIN NAME -->
  <text class="title-text" x="60" y="145" font-size="56" fill="url(#title-grad)">RAMJI SHARMA</text>

  <!-- EXACT REQUESTED ROLE -->
  <g transform="translate(60, 168)">
    <rect width="490" height="42" rx="8" fill="#00F0FF" fill-opacity="0.08" stroke="#00F0FF" stroke-opacity="0.4" stroke-width="1.5" />
    <!-- Terminal prompt symbol -->
    <text x="16" y="27" fill="#00F0FF" font-family="'Fira Code', monospace" font-size="20" font-weight="700">&gt;_</text>
    <text class="subtitle-text" x="48" y="27" font-size="19" fill="#00F0FF">DevOps, DevSecOps, Cloud Engineer</text>
  </g>

  <!-- Value Statement -->
  <text class="body-text" x="60" y="245" font-size="15" fill="#94A3B8" font-weight="400">
    11+ Years IT | 5+ Years DevOps | High-Availability BFSI Platforms (HDFC &amp; IDFC First Bank)
  </text>
  <text class="body-text" x="60" y="270" font-size="14" fill="#64748B">
    Specializing in Enterprise Azure Landing Zones, Zero-Trust GitOps, and Agentic AI.
  </text>

  <!-- Quick Highlight Pills -->
  <g transform="translate(60, 310)">
    <!-- Pill 1: Azure & AWS -->
    <rect x="0" y="0" width="145" height="32" rx="6" fill="#1E293B" stroke="#334155" stroke-width="1" />
    <text x="14" y="20" fill="#38BDF8" font-family="'Fira Code', monospace" font-size="12" font-weight="600">☁️ Azure &amp; AWS</text>

    <!-- Pill 2: Terraform -->
    <rect x="155" y="0" width="165" height="32" rx="6" fill="#1E293B" stroke="#334155" stroke-width="1" />
    <text x="14" y="20" fill="#A78BFA" font-family="'Fira Code', monospace" font-size="12" font-weight="600" transform="translate(155, 0)">⚙️ Terraform IaC</text>

    <!-- Pill 3: K8s & AKS -->
    <rect x="330" y="0" width="155" height="32" rx="6" fill="#1E293B" stroke="#334155" stroke-width="1" />
    <text x="14" y="20" fill="#34D399" font-family="'Fira Code', monospace" font-size="12" font-weight="600" transform="translate(330, 0)">☸️ AKS &amp; GitOps</text>
  </g>

  <g transform="translate(60, 354)">
    <!-- Pill 4: Zero Trust -->
    <rect x="0" y="0" width="180" height="32" rx="6" fill="#1E293B" stroke="#334155" stroke-width="1" />
    <text x="14" y="20" fill="#F472B6" font-family="'Fira Code', monospace" font-size="12" font-weight="600">🛡️ Zero-Trust Security</text>

    <!-- Pill 5: Agentic AI -->
    <rect x="190" y="0" width="160" height="32" rx="6" fill="#1E293B" stroke="#334155" stroke-width="1" />
    <text x="14" y="20" fill="#FBBF24" font-family="'Fira Code', monospace" font-size="12" font-weight="600" transform="translate(190, 0)">🤖 Agentic AI &amp; RAG</text>
    
    <!-- Pill 6: Mumbai, IN -->
    <rect x="360" y="0" width="125" height="32" rx="6" fill="#1E293B" stroke="#334155" stroke-width="1" />
    <text x="14" y="20" fill="#E2E8F0" font-family="'Fira Code', monospace" font-size="12" font-weight="600" transform="translate(360, 0)">📍 Mumbai, IN</text>
  </g>

  <!-- Metric Badges Row -->
  <g transform="translate(60, 408)">
    <text x="0" y="16" fill="#00F0FF" font-family="'Fira Code', monospace" font-size="12" font-weight="600">99.9% PROD SLA</text>
    <text x="135" y="16" fill="#475569" font-family="'Fira Code', monospace" font-size="12">•</text>
    <text x="155" y="16" fill="#38BDF8" font-family="'Fira Code', monospace" font-size="12" font-weight="600">65% FASTER DEPLOYS</text>
    <text x="325" y="16" fill="#475569" font-family="'Fira Code', monospace" font-size="12">•</text>
    <text x="345" y="16" fill="#A78BFA" font-family="'Fira Code', monospace" font-size="12" font-weight="600">ZERO LONG-LIVED SECRETS</text>
  </g>


  <!-- ==================== RIGHT COLUMN: CODE TERMINAL ==================== -->
  <g transform="translate(600, 45)" filter="url(#drop-shadow)">
    <!-- Terminal Window Frame -->
    <rect width="540" height="370" rx="12" fill="url(#terminal-bg)" stroke="#1E293B" stroke-width="1.5" />
    
    <!-- Titlebar -->
    <path d="M 0 12 Q 0 0 12 0 L 528 0 Q 540 0 540 12 L 540 38 L 0 38 Z" fill="#0F172A" />
    <line x1="0" y1="38" x2="540" y2="38" stroke="#1E293B" stroke-width="1" />
    
    <!-- Window Controls -->
    <circle cx="20" cy="19" r="6" fill="#EF4444" />
    <circle cx="38" cy="19" r="6" fill="#F59E0B" />
    <circle cx="56" cy="19" r="6" fill="#10B981" />
    
    <!-- Tab Title -->
    <text x="80" y="23" fill="#94A3B8" font-family="'Fira Code', monospace" font-size="12" font-weight="500">ramji-platform.tf — Terraform Cloud</text>
    <rect x="440" y="10" width="80" height="18" rx="4" fill="#1E293B" />
    <text x="452" y="23" fill="#38BDF8" font-family="'Fira Code', monospace" font-size="10" font-weight="600">TERRAFORM</text>

    <!-- Code Line Numbers -->
    <g fill="#475569" class="code-text" text-anchor="end">
      <text x="36" y="68">1</text>
      <text x="36" y="90">2</text>
      <text x="36" y="112">3</text>
      <text x="36" y="134">4</text>
      <text x="36" y="156">5</text>
      <text x="36" y="178">6</text>
      <text x="36" y="200">7</text>
      <text x="36" y="222">8</text>
      <text x="36" y="244">9</text>
      <text x="36" y="266">10</text>
      <text x="36" y="288">11</text>
      <text x="36" y="310">12</text>
      <text x="36" y="332">13</text>
      <text x="36" y="354">14</text>
    </g>

    <!-- Code Separator Vertical Line -->
    <line x1="48" y1="48" x2="48" y2="360" stroke="#1E293B" stroke-width="1" />

    <!-- Syntax Highlighted Code Content -->
    <g class="code-text" transform="translate(60, 0)">
      <!-- Line 1 -->
      <text x="0" y="68">
        <tspan fill="#F43F5E">module </tspan>
        <tspan fill="#FBBF24">"enterprise_platform"</tspan>
        <tspan fill="#94A3B8"> {</tspan>
      </text>

      <!-- Line 2 -->
      <text x="16" y="90">
        <tspan fill="#38BDF8">engineer        </tspan>
        <tspan fill="#94A3B8">= </tspan>
        <tspan fill="#34D399">"Ramji Sharma"</tspan>
      </text>

      <!-- Line 3 -->
      <text x="16" y="112">
        <tspan fill="#38BDF8">designation     </tspan>
        <tspan fill="#94A3B8">= [</tspan>
        <tspan fill="#34D399">"DevOps"</tspan><tspan fill="#94A3B8">, </tspan>
        <tspan fill="#34D399">"DevSecOps"</tspan><tspan fill="#94A3B8">, </tspan>
        <tspan fill="#34D399">"Cloud Engineer"</tspan>
        <tspan fill="#94A3B8">]</tspan>
      </text>

      <!-- Line 4 -->
      <text x="16" y="134">
        <tspan fill="#38BDF8">experience      </tspan>
        <tspan fill="#94A3B8">= </tspan>
        <tspan fill="#F59E0B">"11+ Yrs IT | 5+ Yrs DevOps"</tspan>
      </text>

      <!-- Line 5 -->
      <text x="16" y="156">
        <tspan fill="#38BDF8">bfsi_clients     </tspan>
        <tspan fill="#94A3B8">= [</tspan>
        <tspan fill="#34D399">"HDFC Bank"</tspan><tspan fill="#94A3B8">, </tspan>
        <tspan fill="#34D399">"IDFC First Bank"</tspan>
        <tspan fill="#94A3B8">]</tspan>
      </text>

      <!-- Line 6 -->
      <text x="16" y="178">
        <tspan fill="#64748B">// Security &amp; Compliance Hardening</tspan>
      </text>

      <!-- Line 7 -->
      <text x="16" y="200">
        <tspan fill="#38BDF8">zero_trust_spec </tspan>
        <tspan fill="#94A3B8">= {</tspan>
      </text>

      <!-- Line 8 -->
      <text x="32" y="222">
        <tspan fill="#E2E8F0">identity    </tspan>
        <tspan fill="#94A3B8">= </tspan>
        <tspan fill="#A78BFA">"OIDC Workload Federation + PIM"</tspan>
      </text>

      <!-- Line 9 -->
      <text x="32" y="244">
        <tspan fill="#E2E8F0">governance  </tspan>
        <tspan fill="#94A3B8">= </tspan>
        <tspan fill="#A78BFA">"Azure CAF Landing Zones + Policy"</tspan>
      </text>

      <!-- Line 10 -->
      <text x="32" y="266">
        <tspan fill="#E2E8F0">inspection  </tspan>
        <tspan fill="#94A3B8">= </tspan>
        <tspan fill="#A78BFA">"Hub-Spoke + Azure Firewall + UDR"</tspan>
      </text>

      <!-- Line 11 -->
      <text x="16" y="288">
        <tspan fill="#94A3B8">}</tspan>
      </text>

      <!-- Line 12 -->
      <text x="16" y="310">
        <tspan fill="#64748B">// Next-Gen AI Operations</tspan>
      </text>

      <!-- Line 13 -->
      <text x="16" y="332">
        <tspan fill="#38BDF8">ai_copilots     </tspan>
        <tspan fill="#94A3B8">= [</tspan>
        <tspan fill="#FBBF24">"MCP-Agents"</tspan><tspan fill="#94A3B8">, </tspan>
        <tspan fill="#FBBF24">"RAG-Runbooks"</tspan>
        <tspan fill="#94A3B8">]</tspan>
      </text>

      <!-- Line 14 -->
      <text x="0" y="354">
        <tspan fill="#94A3B8">}</tspan>
        <!-- Blinking cursor -->
        <tspan fill="#00F0FF" class="cursor"> █</tspan>
      </text>
    </g>
  </g>
</svg>
